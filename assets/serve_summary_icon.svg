<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>工作联系单汇总</title>
  <desc>两份联系单归集为一张带有条目状态的汇总表。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173e62"/>
      <stop offset="1" stop-color="#0a1d36"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#051426" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect x="34" y="34" width="956" height="956" rx="220" fill="url(#background)"/>
  <rect x="53" y="53" width="918" height="918" rx="202" fill="none" stroke="#3c6885" stroke-width="12" opacity=".55"/>

  <!-- Two source documents, kept deliberately simple for small icon sizes. -->
  <g transform="rotate(-12 350 460)">
    <rect x="146" y="213" width="393" height="520" rx="43" fill="#24c7bd"/>
    <path d="M213 323h223M213 386h178M213 449h199" fill="none" stroke="#d9fff9" stroke-width="27" stroke-linecap="round" opacity=".75"/>
  </g>
  <g transform="rotate(12 674 460)">
    <rect x="485" y="213" width="393" height="520" rx="43" fill="#4198f2"/>
    <path d="M590 323h219M626 386h183M607 449h202" fill="none" stroke="#e5f3ff" stroke-width="27" stroke-linecap="round" opacity=".75"/>
  </g>

  <!-- The centered summary document combines the two inputs. -->
  <g filter="url(#shadow)">
    <path d="M277 200h359l113 113v467c0 39-31 70-70 70H277c-39 0-70-31-70-70V270c0-39 31-70 70-70Z" fill="#f7fbff"/>
    <path d="M636 200v82c0 19 15 34 34 34h79Z" fill="#c8e6f6"/>
  </g>
  <rect x="270" y="299" width="235" height="53" rx="25" fill="#183e60"/>
  <rect x="270" y="399" width="424" height="10" rx="5" fill="#cbdbe5"/>
  <g fill="#163c5d">
    <rect x="276" y="470" width="266" height="27" rx="13"/>
    <rect x="276" y="574" width="230" height="27" rx="13"/>
    <rect x="276" y="678" width="276" height="27" rx="13"/>
  </g>
  <g fill="#2dc9b7">
    <rect x="613" y="456" width="67" height="56" rx="18"/>
    <rect x="613" y="560" width="67" height="56" rx="18"/>
    <rect x="613" y="664" width="67" height="56" rx="18"/>
  </g>
</svg>
